<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanWater Access Tracker - Test Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 2px 2px 12px #aaa;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #response {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <h2>Test Railway Backend API</h2>
    
    <div class="form-group">
        <label for="backendUrl">Railway Backend URL:</label>
        <input type="text" id="backendUrl" placeholder="Paste Railway Backend URL here" value="">
    </div>

    <hr/>

    <h3>Test Login Form</h3>
    <form id="loginForm">
        <div class="form-group">
            <label for="username">Username (use 'admin'):</label>
            <input type="text" id="username" required>
        </div>
        <div class="form-group">
            <label for="password">Password (use 'admin123'):</label>
            <input type="password" id="password" required>
        </div>
        <button type="submit">Submit Login</button>
    </form>

    <div id="response" style="display: none;"></div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const backendUrl = document.getElementById('backendUrl').value.trim();
            const responseDiv = document.getElementById('response');
            
            if (!backendUrl) {
                responseDiv.style.display = 'block';
                responseDiv.className = 'error';
                responseDiv.innerText = 'Please enter your Railway Backend URL first!';
                return;
            }

            // Trim trailing slash if present
            const cleanBaseUrl = backendUrl.endsWith('/') ? backendUrl.slice(0, -1) : backendUrl;
            
            const usernameInput = document.getElementById('username').value;
            const passwordInput = document.getElementById('password').value;

            responseDiv.style.display = 'block';
            responseDiv.className = '';
            responseDiv.innerText = 'Sending request...';

            try {
                const response = await fetch(`${cleanBaseUrl}/api/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: usernameInput,
                        password: passwordInput
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    responseDiv.className = 'success';
                    responseDiv.innerText = `Success!\nResponse: ${JSON.stringify(data)}`;
                } else {
                    responseDiv.className = 'error';
                    responseDiv.innerText = `Failed: ${data.detail || JSON.stringify(data)}`;
                }
            } catch (err) {
                responseDiv.className = 'error';
                responseDiv.innerText = `Error connecting to backend:\n${err.message}`;
            }
        });
    </script>
</body>
</html>
